name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Record runner image
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_os=%s\n' "$RUNNER_OS"
          printf 'image_os=%s\n' "${ImageOS:-unknown}"
          printf 'image_version=%s\n' "${ImageVersion:-unknown}"
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

  linux:
    name: linux (musl)
    runs-on: ubuntu-24.04
    needs: workflows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Record runner image
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_os=%s\n' "$RUNNER_OS"
          printf 'image_os=%s\n' "${ImageOS:-unknown}"
          printf 'image_version=%s\n' "${ImageVersion:-unknown}"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master as of 2026-11-21
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Generate man page
        run: cargo run --locked --bin gen_man
      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "dist/portensor-${version}-linux-x86_64/bin"
          mkdir -p "dist/portensor-${version}-linux-x86_64/share/man/man1"
          mkdir -p "dist/portensor-${version}-linux-x86_64/packs"
          cp target/x86_64-unknown-linux-musl/release/portensor \
            "dist/portensor-${version}-linux-x86_64/bin/"
          cp man/*.1 "dist/portensor-${version}-linux-x86_64/share/man/man1/"
          cp -r packs/official-baseline \
            "dist/portensor-${version}-linux-x86_64/packs/"
          cp README.md CHANGELOG.md LICENSE "dist/portensor-${version}-linux-x86_64/"
          tar -czf "dist/portensor-${version}-linux-x86_64.tar.gz" \
            -C "dist/portensor-${version}-linux-x86_64" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: dist/*.tar.gz

  windows:
    name: windows (gnu)
    runs-on: windows-2022
    needs: workflows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Record runner image
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_os=%s\n' "$RUNNER_OS"
          printf 'image_os=%s\n' "${ImageOS:-unknown}"
          printf 'image_version=%s\n' "${ImageVersion:-unknown}"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master as of 2026-11-21
        with:
          toolchain: 1.99.1
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $dir = "dist/portensor-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$dir/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dir/packs" | Out-Null
          Copy-Item "target/x86_64-pc-windows-gnu/release/portensor.exe" "$dir/bin/"
          Copy-Item -Recurse "packs/official-baseline" "$dir/packs/"
          Copy-Item README.md,CHANGELOG.md,LICENSE $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/portensor-$version-windows-x86_64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: dist/*.zip

  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    needs: workflows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Record runner image
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_os=%s\n' "$RUNNER_OS"
          printf 'image_os=%s\n' "${ImageOS:-unknown}"
          printf 'image_version=%s\n' "${ImageVersion:-unknown}"
      - name: Clean dist
        run: rm -rf dist
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master as of 2026-11-21
        with:
          toolchain: 1.99.1
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.10 --locked
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo cyclonedx --format json --spec-version 1.5 --target all \
            --override-filename "portensor-${version}.cdx"
          mkdir -p dist
          mv "portensor-${version}.cdx.json" "dist/"
      - name: Validate CycloneDX SBOM
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 - "dist/portensor-${version}.cdx.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          document = json.loads(path.read_text(encoding="utf-8"))
          if document.get("bomFormat") != "CycloneDX":
              raise SystemExit("SBOM is not CycloneDX")
          if document.get("specVersion") not in {"1.5", "1.6", "1.7"}:
              raise SystemExit(f"unsupported CycloneDX version: {document.get('specVersion')}")
          components = document.get("components") or []
          if len(components) < 100:
              raise SystemExit(f"SBOM has too few components: {len(components)}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: dist/portensor-*.cdx.json

  publish:
    name: publish
    runs-on: ubuntu-24.04
    needs: [workflows, linux, windows, sbom]
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      HAS_COSIGN: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Record runner image
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_os=%s\n' "$RUNNER_OS"
          printf 'image_os=%s\n' "${ImageOS:-unknown}"
          printf 'image_version=%s\n' "${ImageVersion:-unknown}"
      - name: Clean dist
        run: rm -rf dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Require release signing
        run: |
          set -euo pipefail
          if [ "$HAS_GPG" != "true" ] && [ "$HAS_COSIGN" != "true" ]; then
            echo "release signing is required: configure GPG_PRIVATE_KEY or COSIGN_PRIVATE_KEY" >&2
            exit 1
          fi
      - name: Checksums
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sbom="dist/portensor-${version}.cdx.json"
          test -f "$sbom"
          cd dist
          sha256sum -- *.tar.gz *.zip *.cdx.json > SHA256SUMS
          grep -Fq "  portensor-${version}.cdx.json" SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Sign checksums (GPG)
        if: env.HAS_GPG == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          if [ -n "$GPG_PASSPHRASE" ]; then
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          else
            gpg --batch --yes --armor --detach-sign \
              --output dist/SHA256SUMS.asc dist/SHA256SUMS
          fi
          gpg --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          test -n "$fingerprint"
          gpg --armor --export "$fingerprint" > dist/SHA256SUMS.gpg.pub
          verify_home="$(mktemp -d)"
          GNUPGHOME="$verify_home" gpg --batch --import dist/SHA256SUMS.gpg.pub
          GNUPGHOME="$verify_home" gpg --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          rm -rf "$verify_home"
      - name: Install cosign
        if: env.HAS_COSIGN == 'true'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v3.1.4
      - name: Sign checksums (cosign)
        if: env.HAS_COSIGN == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          printf '%s' "$COSIGN_PRIVATE_KEY" > "$tmpdir/cosign.key"
          cosign sign-blob --yes --key "$tmpdir/cosign.key" \
            --bundle dist/SHA256SUMS.cosign.bundle dist/SHA256SUMS
          cosign public-key --key "$tmpdir/cosign.key" \
            --outfile dist/SHA256SUMS.cosign.pub
          cosign verify-blob --key dist/SHA256SUMS.cosign.pub \
            --bundle dist/SHA256SUMS.cosign.bundle dist/SHA256SUMS
      - name: Locate SBOM
        id: sbom_file
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          path="dist/portensor-${version}.cdx.json"
          test -f "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.cdx.json
      - name: Attest SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
          sbom-path: ${{ steps.sbom_file.outputs.path }}
      - name: Extract release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ contains(github.ref_name, '-rc.') && 'false' || 'true' }}
