name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master as of 2026-11-21
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Release build
        run: cargo build --release --locked
      - name: Exact localhost gate
        run: python3 bench/localhost_gate.py
      - name: Raw SYN privilege failure
        run: |
          set +e
          output=$(./target/release/portensor scan --syn --target 127.0.0.1 --ports 80 --quiet 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -q "requires root privileges"
      - name: Benchmark harness tests
        run: python3 -m unittest discover -s bench/tests -t . -v

  windows:
    name: windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master as of 2026-11-21
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: Check
        run: cargo check --all-targets --all-features --locked
      - name: Test raw networking
        run: "cargo test --lib --all-features --locked syn::"

  audit:
    name: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit

  deny:
    name: deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@094a77a254a15132dbeb0fb0744a2307f086e063 # v2.1.3
        with:
          command: check
