# Container orchestrators, service discovery, and secret stores with
# unauthenticated HTTP identity endpoints.

name = "containers"
description = "Container platform and control-plane probes"

[[probe]]
name = "docker-version"
service = "docker"
ports = [2375]
product = "Docker Engine"
cpe = "cpe:2.3:a:docker:docker"
confidence = 0.97
version_regex = '"Version"\s*:\s*"([0-9][^"]*)"'

[[probe.step]]
name = "version-json"
send = "GET /version HTTP/1.1\r\nHost: scan\r\nAccept: application/json\r\nConnection: close\r\n\r\n"
expect = '"ApiVersion"'
timeout_ms = 1500

[probe.info]
api_version = '"ApiVersion"\s*:\s*"([^"]+)"'
min_api_version = '"MinAPIVersion"\s*:\s*"([^"]+)"'
go_version = '"GoVersion"\s*:\s*"([^"]+)"'
os = '"Os"\s*:\s*"([^"]+)"'
kernel = '"KernelVersion"\s*:\s*"([^"]+)"'

[[probe]]
name = "docker-ping"
service = "docker"
ports = [2375]
product = "Docker Engine"
confidence = 0.90

[[probe.step]]
name = "ping"
send = "HEAD /_ping HTTP/1.1\r\nHost: scan\r\nConnection: close\r\n\r\n"
expect_regex = '(?i)^(OK|HTTP/1\.[01] [0-9]{3})'
read_until = '\r\n\r\n'
timeout_ms = 1200

[[probe]]
name = "docker-ping-tls"
service = "docker"
ports = [2376]
product = "Docker Engine"
confidence = 0.90
tls = true

[[probe.step]]
name = "ping-tls"
send = "HEAD /_ping HTTP/1.1\r\nHost: scan\r\nConnection: close\r\n\r\n"
expect_regex = '(?i)^(OK|HTTP/1\.[01] [0-9]{3})'
read_until = '\r\n\r\n'
timeout_ms = 1500

[[probe]]
name = "docker-registry"
service = "docker-registry"
ports = [5000]
product = "Docker Registry"
confidence = 0.92

[[probe.step]]
name = "v2"
send = "GET /v2/ HTTP/1.1\r\nHost: scan\r\nConnection: close\r\n\r\n"
expect_regex = '(?i)Docker-Distribution-Api-Version'
read_until = '\r\n\r\n'
timeout_ms = 1200

[probe.info]
api_version = '(?i)Docker-Distribution-Api-Version:\s*([^\r\n]+)'

