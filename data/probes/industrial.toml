# Operational-technology protocols: modest payloads that trigger identity or
# liveness responses without touching process data.

name = "industrial"
description = "OT/ICS protocol identification probes"

[[probe]]
name = "modbus-device-id"
service = "modbus"
ports = [502]
product = "Modbus Device"
confidence = 0.90

[[probe.step]]
name = "read-device-identification"
send_hex = "00 01 00 00 00 06 01 2B 0E 01 00"
expect_hex = "2B 0E"
timeout_ms = 1500

[[probe]]
name = "s7-comm"
service = "s7"
ports = [102]
product = "Siemens S7comm"
confidence = 0.92

[[probe.step]]
name = "cotp-connect"
send_hex = "03 00 00 16 11 E0 00 00 00 01 00 0C C1 02 01 00 C2 02 01 02 C3 02 01 00"
expect_hex = "11 D0"
timeout_ms = 1500

[[probe]]
name = "dnp3-link-status"
service = "dnp3"
ports = [20000]
product = "DNP3 Outstation"
confidence = 0.90

[[probe.step]]
name = "link-status"
send_hex = "05 64 05 C9 01 00 00 00 00"
expect_hex = "05 64"
timeout_ms = 1200

[[probe]]
name = "ethernet-ip-list-services"
service = "ethernet-ip"
ports = [44818]
product = "EtherNet/IP Device"
confidence = 0.92

[[probe.step]]
name = "list-services"
send_hex = "04 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"
expect_hex = "00 01 14 00 01 00 20 00"
timeout_ms = 1500

[probe.info]
service_name = '(Communications)'

[[probe]]
name = "opcua-hello"
service = "opcua"
ports = [4840]
product = "OPC UA Server"
confidence = 0.90

[[probe.step]]
name = "hello-ack"
send_hex = "48 45 4C 46 20 00 00 00 00 00 00 00 00 00 01 00 00 00 01 00 00 00 00 00 00 00 00 00 00 00 00 00"
expect_hex = "41 43 4B 46"
timeout_ms = 1500

[[probe]]
name = "iec-104-startdt"
service = "iec-104"
ports = [2404]
product = "IEC 60870-5-104 Server"
confidence = 0.92
send_hex = "68 04 07 00 00 00"
expect_hex = "68 04 0B"
timeout_ms = 1500

[[probe]]
name = "niagara-fox"
service = "niagara-fox"
ports = [1911, 4911]
product = "Tridium Niagara Fox"
confidence = 0.90
version_regex = 'app\.version=s:([^\n;]+)'
send = "fox a 1 -1 fox hello\n{\nfox.version=s:1.0\nid=i:1\n};;\n"
expect = "fox a 0"
timeout_ms = 1500

[[probe]]
name = "omron-fins"
service = "fins"
ports = [9600]
product = "OMRON FINS PLC"
confidence = 0.92
send_hex = "46 49 4E 53 00 00 00 0C 00 00 00 00 00 00 00 00 00 00 00 00"
expect_hex = "46 49 4E 53 00 00 00 10 00 00 00 01"
timeout_ms = 1500

[[probe]]
name = "hart-ip-session"
service = "hart-ip"
ports = [5094]
product = "HART-IP Server"
confidence = 0.90
send_hex = "01 00 00 00 00 01 00 0D 01 00 00 4E 20"
expect_hex = "01 01 00 00"
timeout_ms = 1500

[[probe]]
name = "ge-srtp-info"
service = "ge-srtp"
ports = [18245]
product = "GE SRTP PLC"
confidence = 0.90

[[probe.step]]
name = "initialize"
send_hex = "00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"
expect_regex = '(?s)^\x01.{7}\x0F'
timeout_ms = 1500

[[probe.step]]
name = "read-system-register"
send_hex = "02 00 01 00 00 00 00 00 00 01 00 00 00 00 00 00 00 01 00 00 00 00 00 00 00 00 00 00 00 00 06 C0 00 00 00 00 10 0E 00 00 01 01 04 08 00 00 01 00 00 00 00 00 00 00 00 00"
expect_regex = '(?s)^\x03\x01\x00'
expect_hex = "D4"
timeout_ms = 1500

[[probe]]
name = "melsec-q-cpuinfo"
service = "melsec-q"
ports = [5007]
product = "Mitsubishi MELSEC-Q PLC"
confidence = 0.90
send_hex = "57 00 00 00 00 11 11 07 00 00 FF FF 03 00 00 FE 03 00 00 14 00 1C 08 0A 08 00 00 00 00 00 00 00 04 01 01 01 00 00 00 00 01"
expect_hex = "D7 00"
timeout_ms = 1500

[[probe]]
name = "pcworx-info"
service = "pcworx"
ports = [1962]
product = "Phoenix Contact PCWorx PLC"
confidence = 0.92
timeout_ms = 2000

[[probe.step]]
name = "initialize"
send_hex = "01 01 00 1A 00 00 00 00 78 80 00 03 00 0C 49 42 45 54 48 30 31 4E 30 5F 4D 00"
expect_hex = "81"
expect_hex_offset = 0
capture_hex = { sid = "17:1" }
timeout_ms = 1500

[[probe.step]]
name = "open-session"
send_hex = "01 05 00 16 00 01 00 00 78 80 00 ${sid} 00 00 00 06 00 04 02 95 00 00"
timeout_ms = 1500

[[probe.step]]
name = "request-info"
send_hex = "01 06 00 0E 00 02 00 00 00 00 00 ${sid} 04 00"
expect_hex = "81"
expect_hex_offset = 0
timeout_ms = 1500
