[[probe.step]]
name = "status"
send = "GET /api/status HTTP/1.1\r\nHost: scan\r\nAccept: application/json\r\nConnection: close\r\n\r\n"
expect = '"Version"'
read_until = '\r\n\r\n'
timeout_ms = 2000

[[probe]]
name = "sonarqube-status"
service = "sonarqube"
