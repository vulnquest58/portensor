send = "GET /api/status HTTP/1.1\r\nHost: scan\r\nAccept: application/json\r\nConnection: close\r\n\r\n"
expect = '"Version"'
timeout_ms = 1500

[[probe]]
name = "portainer-https"
service = "portainer"
ports = [9443]
product = "Portainer"
