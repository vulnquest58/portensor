# Message-broker and pub/sub protocols: identity disclosures that come from
# standard handshake traffic a normal client would send.

name = "messaging"
description = "Message broker protocol identification probes"

[[probe]]
name = "mqtt-connect"
service = "mqtt"
ports = [1883, 1884]
product = "MQTT Broker"
confidence = 0.92

[[probe.step]]
name = "connect"
send_hex = "10 13 00 04 4D 51 54 54 04 02 00 3C 00 07 72 61 79 73 63 61 6E"
expect_hex = "20 02"
timeout_ms = 1500

[[probe]]
name = "mqtt-connect-tls"
service = "mqtt"
ports = [8883, 8884]
product = "MQTT Broker"
confidence = 0.92
tls = true

[[probe.step]]
name = "connect"
send_hex = "10 13 00 04 4D 51 54 54 04 02 00 3C 00 07 72 61 79 73 63 61 6E"
expect_hex = "20 02"
timeout_ms = 1500

[[probe]]
name = "kafka-apiversions"
service = "kafka"
ports = [9092]
product = "Apache Kafka"
cpe = "cpe:2.3:a:apache:kafka"
confidence = 0.90

[[probe.step]]
name = "api-versions"
send_hex = "00 00 00 0A 00 12 00 00 00 00 00 01 FF FF"
expect_hex = "00 12 00 00"
timeout_ms = 1500

[[probe]]
name = "kafka-apiversions-tls"
service = "kafka"
ports = [9093]
product = "Apache Kafka"
cpe = "cpe:2.3:a:apache:kafka"
confidence = 0.90
tls = true

[[probe.step]]
name = "api-versions"
send_hex = "00 00 00 0A 00 12 00 00 00 00 00 01 FF FF"
expect_hex = "00 12 00 00"
timeout_ms = 1500

[[probe]]
name = "rabbitmq-amqp-start"
service = "rabbitmq"
ports = [5672]
product = "RabbitMQ"
cpe = "cpe:2.3:a:pivotal:rabbitmq"
confidence = 0.96
version_regex = '(?s)version.{0,8}?([0-9]+\.[0-9]+\.[0-9]+)'

[[probe.step]]
name = "connection-start"
send_hex = "41 4D 51 50 00 00 09 01"
expect_hex = "41 4D 51 50 00 00 09 01"
expect_regex = '(?s)RabbitMQ'
timeout_ms = 1800

[[probe]]
name = "rabbitmq-amqp-start-tls"
service = "rabbitmq"
ports = [5671]
product = "RabbitMQ"
cpe = "cpe:2.3:a:pivotal:rabbitmq"
confidence = 0.96
tls = true
version_regex = '(?s)version.{0,8}?([0-9]+\.[0-9]+\.[0-9]+)'

[[probe.step]]
name = "connection-start"
send_hex = "41 4D 51 50 00 00 09 01"
expect_hex = "41 4D 51 50 00 00 09 01"
expect_regex = '(?s)RabbitMQ'
timeout_ms = 2000

[[probe]]
name = "nats-info"
service = "nats"
ports = [4222]
product = "NATS"
confidence = 0.94
version_regex = '"version"\s*:\s*"([^"]+)"'

[[probe.step]]
name = "info"
expect = '"server_id"'
timeout_ms = 1200

[probe.info]
server_name = '"server_name"\s*:\s*"([^"]+)"'
go_version = '"go"\s*:\s*"([^"]+)"'
