name = "official-baseline"
description = "Read-only baseline checks for certificate hygiene, cleartext protocols, exposed services, version disclosure, SMB hardening, unauthenticated Redis, and exposed Docker APIs"

[[script]]
name = "tls-certificate"
description = "Reports expired, soon-to-expire, self-signed, and SHA-1/MD5-signed TLS certificates"
category = "compliance"
danger = "safe"
capabilities = ["metadata"]
command = ["python3", "checks.py", "tls-certificate"]
services = [
  "https",
  "https-alt",
  "imaps",
  "pop3s",
  "smtps",
  "ldaps",
  "ftps",
  "winrm-https",
  "docker-tls",
  "mqtts",
  "sip-tls",
  "tls",
  "ftp-starttls",
  "smtp-starttls",
  "pop3-starttls",
  "imap-starttls",
  "starttls",
  "docker",
  "kubernetes",
  "kubernetes-kubelet",
  "etcd",
  "elasticsearch",
  "opensearch",
  "vault",
  "portainer",
  "mongodb",
  "mqtt",
  "kafka",
  "rabbitmq",
  "winrm",
  "smtp",
  "imap",
  "pop3",
  "ftp",
  "postgresql",
  "mysql",
]
timeout_ms = 3000

